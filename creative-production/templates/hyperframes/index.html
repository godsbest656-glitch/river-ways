<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>River Ways — Creative Motion Starter</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <main
    id="stage"
    data-hf-id="river-ways-stage"
    data-composition-id="river-ways-starter"
    data-width="1920"
    data-height="1080"
    data-start="0"
    data-duration="8"
    data-fps="30"
  >
    <div class="field field--one" aria-hidden="true"></div>
    <div class="field field--two" aria-hidden="true"></div>
    <div class="current current--back" aria-hidden="true"></div>

    <header class="masthead">
      <span class="brand">RIVER WAYS</span>
      <span class="descriptor">CREATIVE DEMAND ENGINEERING</span>
    </header>
    <section class="message">
      <p class="eyebrow">STRATEGY · CREATIVE · GROWTH</p>
      <h1>We engineer<br><span>demand.</span></h1>
      <p class="subline">Find the current. Shape what follows.</p>
    </section>
    <footer class="foot">
      <span>SHAPED CURRENT</span>
      <span>01 / 01</span>
    </footer>
  </main>

</html>
