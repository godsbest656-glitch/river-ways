name: Cloudflare Pages preview

on:
  push:
    branches:
      - feat/river-ways-pages-integration
      - feat/ads-gate-readiness
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-preview-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy-preview:
    if: startsWith(github.ref_name, 'feat/')
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4

        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Test contact endpoint
        run: npm run test:api

      - name: Build website
        run: npm run build

      - name: Stamp built HTML with this source commit
        env:
          GITHUB_SHA: ${{ github.sha }}
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync, writeFileSync } from 'node:fs';
          const path = 'dist/index.html';
          const html = readFileSync(path, 'utf8');
          const marker = 'name="river-ways-release" content="UNSTAMPED"';
          if (!html.includes(marker)) throw new Error('Release marker missing; refusing preview deployment.');
          writeFileSync(path, html.replace(marker, `name="river-ways-release" content="${process.env.GITHUB_SHA}"`));
          NODE

      - name: Create isolated Pages project if missing
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if npx --yes wrangler@3.90.0 pages project list | grep -Fq 'riverwayse-website'; then
            echo "Cloudflare Pages project already exists."
          else
            npx --yes wrangler@3.90.0 pages project create riverwayse-website --production-branch main
          fi

      - name: Deploy feature-branch preview
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=riverwayse-website --branch=${{ github.ref_name }}

      - name: Smoke-test deployed preview
        shell: bash
        run: |
          set -euo pipefail
          slug="${GITHUB_REF_NAME//\//-}"
          BASE_URL="https://${slug}.riverwayse-website.pages.dev"
          html="$(curl --fail --silent --show-error "$BASE_URL/")"
          if ! printf '%s' "$html" | grep -Fq "name=\"river-ways-release\" content=\"$GITHUB_SHA\""; then
            echo "Preview does not serve this exact source commit ($GITHUB_SHA)"
            exit 1
          fi
          echo "OK release marker ($GITHUB_SHA)"
          for route in "/" "/privacy/" "/field-guide/" "/growth-diagnostic/" "/growth-diagnostic/diagnostic.js"; do
            status="$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' "$BASE_URL$route")"
            if [ "$status" != "200" ]; then
              echo "Preview route $route returned HTTP $status"
              exit 1
            fi
            echo "OK $route ($status)"
          done
          headers="$(curl --silent --show-error --head "$BASE_URL/")"
          for header in \
            '^x-frame-options: DENY
          api_status="$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' "$BASE_URL/api/contact")"
          if [ "$api_status" != "405" ]; then
            echo "Contact function GET smoke test returned HTTP $api_status (expected 405)"
            exit 1
          fi
          echo "OK /api/contact function route ($api_status for GET)"
          # Exercise the Pages Function's runtime binding without creating a lead.
          # The honeypot response is neutral and must never persist or notify.
          contact_status="$(curl --silent --show-error --output /tmp/contact-smoke.json --write-out '%{http_code}' \
            --request POST \
            --header 'Content-Type: application/json' \
            --data '{"name":"Preview smoke test","email":"preview-smoke@example.invalid","goal":"Generate more qualified demand","website":"automated-honeypot"}' \
            "$BASE_URL/api/contact")"
          if [ "$contact_status" != "200" ] || ! grep -q '"ok":true' /tmp/contact-smoke.json; then
            echo "Contact runtime smoke test failed (HTTP $contact_status). Check the Preview LEADS_DB binding."
            cat /tmp/contact-smoke.json
            exit 1
          fi
          echo "OK /api/contact runtime binding (honeypot safely acknowledged; no lead stored)"
 \
            '^x-content-type-options: nosniff
          api_status="$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' "$BASE_URL/api/contact")"
          if [ "$api_status" != "405" ]; then
            echo "Contact function GET smoke test returned HTTP $api_status (expected 405)"
            exit 1
          fi
          echo "OK /api/contact function route ($api_status for GET)"
          # Exercise the Pages Function's runtime binding without creating a lead.
          # The honeypot response is neutral and must never persist or notify.
          contact_status="$(curl --silent --show-error --output /tmp/contact-smoke.json --write-out '%{http_code}' \
            --request POST \
            --header 'Content-Type: application/json' \
            --data '{"name":"Preview smoke test","email":"preview-smoke@example.invalid","goal":"Generate more qualified demand","website":"automated-honeypot"}' \
            "$BASE_URL/api/contact")"
          if [ "$contact_status" != "200" ] || ! grep -q '"ok":true' /tmp/contact-smoke.json; then
            echo "Contact runtime smoke test failed (HTTP $contact_status). Check the Preview LEADS_DB binding."
            cat /tmp/contact-smoke.json
            exit 1
          fi
          echo "OK /api/contact runtime binding (honeypot safely acknowledged; no lead stored)"
 \
            '^referrer-policy: strict-origin-when-cross-origin
          api_status="$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' "$BASE_URL/api/contact")"
          if [ "$api_status" != "405" ]; then
            echo "Contact function GET smoke test returned HTTP $api_status (expected 405)"
            exit 1
          fi
          echo "OK /api/contact function route ($api_status for GET)"
          # Exercise the Pages Function's runtime binding without creating a lead.
          # The honeypot response is neutral and must never persist or notify.
          contact_status="$(curl --silent --show-error --output /tmp/contact-smoke.json --write-out '%{http_code}' \
            --request POST \
            --header 'Content-Type: application/json' \
            --data '{"name":"Preview smoke test","email":"preview-smoke@example.invalid","goal":"Generate more qualified demand","website":"automated-honeypot"}' \
            "$BASE_URL/api/contact")"
          if [ "$contact_status" != "200" ] || ! grep -q '"ok":true' /tmp/contact-smoke.json; then
            echo "Contact runtime smoke test failed (HTTP $contact_status). Check the Preview LEADS_DB binding."
            cat /tmp/contact-smoke.json
            exit 1
          fi
          echo "OK /api/contact runtime binding (honeypot safely acknowledged; no lead stored)"
 \
            '^permissions-policy:' \
            '^content-security-policy:'; do
            printf '%s\n' "$headers" | grep -Eqi "$header" || {
              echo "Missing required preview response header: $header"
              exit 1
            }
          done
          api_status="$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' "$BASE_URL/api/contact")"
          if [ "$api_status" != "405" ]; then
            echo "Contact function GET smoke test returned HTTP $api_status (expected 405)"
            exit 1
          fi
          echo "OK /api/contact function route ($api_status for GET)"
          # Exercise the Pages Function's runtime binding without creating a lead.
          # The honeypot response is neutral and must never persist or notify.
          contact_status="$(curl --silent --show-error --output /tmp/contact-smoke.json --write-out '%{http_code}' \
            --request POST \
            --header 'Content-Type: application/json' \
            --data '{"name":"Preview smoke test","email":"preview-smoke@example.invalid","goal":"Generate more qualified demand","website":"automated-honeypot"}' \
            "$BASE_URL/api/contact")"
          if [ "$contact_status" != "200" ] || ! grep -q '"ok":true' /tmp/contact-smoke.json; then
            echo "Contact runtime smoke test failed (HTTP $contact_status). Check the Preview LEADS_DB binding."
            cat /tmp/contact-smoke.json
            exit 1
          fi
          echo "OK /api/contact runtime binding (honeypot safely acknowledged; no lead stored)"
