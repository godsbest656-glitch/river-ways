name: Cloudflare isolated preview

on:
  push:
    branches:
      - feat/river-ways-implementation
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: river-ways-pr-3-preview
  cancel-in-progress: true

jobs:
  verify-and-preview:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      VITE_TURNSTILE_SITE_KEY: ${{ vars.VITE_TURNSTILE_SITE_KEY }}
    steps:
      - name: Check out implementation branch
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Run tests
        run: npm test

      - name: Build preview assets
        run: npm run build

      - name: Deploy separate workers.dev preview
        if: ${{ env.CLOUDFLARE_ACCOUNT_ID != '' && env.CLOUDFLARE_API_TOKEN != '' }}
        run: npx wrangler deploy --name river-ways-pr-3-preview

      - name: Note missing deployment credentials
        if: ${{ env.CLOUDFLARE_ACCOUNT_ID == '' || env.CLOUDFLARE_API_TOKEN == '' }}
        run: |
          echo '## Cloudflare preview not deployed yet' >> "$GITHUB_STEP_SUMMARY"
          echo '' >> "$GITHUB_STEP_SUMMARY"
          echo 'Tests and build completed. Add repository secrets `CLOUDFLARE_ACCOUNT_ID` and `CLOUDFLARE_API_TOKEN`, then re-run this workflow to publish the isolated preview. The preview uses the separate Worker name `river-ways-pr-3-preview`; it does not configure a custom domain or alter production DNS.' >> "$GITHUB_STEP_SUMMARY"

      - name: Record preview safety boundary
        if: ${{ env.CLOUDFLARE_ACCOUNT_ID != '' && env.CLOUDFLARE_API_TOKEN != '' }}
        run: |
          echo '## Preview deployment target' >> "$GITHUB_STEP_SUMMARY"
          echo '' >> "$GITHUB_STEP_SUMMARY"
          echo 'Deployed only as Worker `river-ways-pr-3-preview` on workers.dev. No custom domain or production DNS changes are performed by this workflow. Contact submission remains disabled until Turnstile and Resend are configured on the preview Worker.' >> "$GITHUB_STEP_SUMMARY"
