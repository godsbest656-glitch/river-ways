name: Cloudflare Pages preview

on:
  push:
    branches:
      - feat/river-ways-pages-integration
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-preview-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy-preview:
    if: github.ref_name == 'feat/river-ways-pages-integration'
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4

        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Test contact endpoint
        run: npm run test:api

      - name: Build website
        run: npm run build

      - name: Create isolated Pages project if missing
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if npx --yes wrangler@3.90.0 pages project list | grep -Fq 'riverwayse-website'; then
            echo "Cloudflare Pages project already exists."
          else
            npx --yes wrangler@3.90.0 pages project create riverwayse-website --production-branch main
          fi

      - name: Deploy feature-branch preview
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=riverwayse-website --branch=${{ github.ref_name }}
