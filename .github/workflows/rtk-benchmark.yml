name: RTK output-efficiency benchmark

on:
  push:
    branches:
      - build/river-ways-execution-agency-agents
  workflow_dispatch:

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out the canonical continuation branch
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Rust Token Killer (RTK)
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL https://raw.githubusercontent.com/rtk-ai/rtk/refs/heads/master/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.local/bin:$PATH"
          rtk --version
          rtk gain

      - name: Install project dependencies
        run: npm install --no-package-lock --no-audit --no-fund

      - name: Compare native and RTK command output
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p "$RUNNER_TEMP/rtk-benchmark"
          report="$RUNNER_TEMP/rtk-benchmark/report.txt"
          : > "$report"
          failures=0

          run_pair() {
            name="$1"
            shift
            native="$RUNNER_TEMP/rtk-benchmark/$name.native.txt"
            compressed="$RUNNER_TEMP/rtk-benchmark/$name.rtk.txt"
            native_status=0
            rtk_status=0

            "$@" > "$native" 2>&1 || native_status=$?
            rtk "$@" > "$compressed" 2>&1 || rtk_status=$?

            native_bytes=$(wc -c < "$native" | tr -d ' ')
            rtk_bytes=$(wc -c < "$compressed" | tr -d ' ')
            if [ "$native_bytes" -gt 0 ]; then
              saved_bytes=$((native_bytes - rtk_bytes))
              saved_pct=$(awk -v n="$native_bytes" -v r="$rtk_bytes" 'BEGIN { printf "%.1f", (n-r)*100/n }')
            else
              saved_bytes=0
              saved_pct="n/a"
            fi

            {
              echo "## $name"
              echo "Native exit: $native_status"
              echo "RTK exit: $rtk_status"
              echo "Native output: $native_bytes bytes"
              echo "RTK output: $rtk_bytes bytes"
              echo "Difference: $saved_bytes bytes ($saved_pct%)"
              echo
            } | tee -a "$report"

            if [ "$native_status" -ne 0 ] || [ "$rtk_status" -ne 0 ]; then
              failures=$((failures + 1))
            fi
          }

          echo "Commit: $GITHUB_SHA" | tee -a "$report"
          echo "Node: $(node --version); npm: $(npm --version); Python: $(python --version 2>&1)" | tee -a "$report"
          echo | tee -a "$report"

          run_pair python-skill-validator python scripts/validate_skills.py .agents/skills
          run_pair python-agent-validator python scripts/validate_codex_agents.py .codex/agents
          run_pair python-regression-tests python -m unittest discover -s tests -p "test_*.py"
          run_pair npm-build npm run build
          run_pair npm-tests npm test
          run_pair npm-portfolio-validation npm run validate:portfolio

          {
            echo "## RTK savings ledger"
            rtk gain --all --format json
          } | tee "$RUNNER_TEMP/rtk-benchmark/rtk-gain.json"

          {
            echo
            echo "RTK version:"
            rtk --version
            echo
            echo "A byte reduction is a command-output measurement, not a measurement of total model/API cost."
            echo "Paired commands are run separately; timings are not compared and the benchmark is not a performance benchmark."
          } | tee -a "$report"

          if [ "$failures" -ne 0 ]; then
            echo "Benchmark rejected: $failures paired command(s) had a non-zero exit status." | tee -a "$report"
            exit 1
          fi

      - name: Upload benchmark report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: river-ways-rtk-benchmark-${{ github.run_id }}
          path: ${{ runner.temp }}/rtk-benchmark/
          if-no-files-found: warn
          retention-days: 14
