name: River Ways checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build-and-api-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Build website
        run: npm run build
      - name: Test enquiry API
        run: npm run test:api
      - name: Audit dependencies
        run: npm audit --audit-level=high
