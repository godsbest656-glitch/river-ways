name: River Ways topic-branch checks

on:
  push:
    branches-ignore:
      - main
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - ".agents/**"

permissions:
  contents: read

concurrency:
  group: river-ways-topic-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-api-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out topic branch
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Build website
        run: npm run build
      - name: Test enquiry API
        run: npm run test:api
      - name: Audit dependencies
        run: npm audit --audit-level=high
