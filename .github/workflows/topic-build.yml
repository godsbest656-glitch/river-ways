name: River Ways topic-branch checks

on:
  push:
    branches-ignore:
      - main
    paths-ignore:
      - "docs/**"

permissions:
  contents: read

concurrency:
  group: river-ways-topic-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-api-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out topic branch
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate project skills
        run: python scripts/validate_skills.py .agents/skills
      - name: Test skill validator
        run: python -m unittest discover -s tests -p "test_*.py"
      - name: Validate D1 migrations
        run: python scripts/validate_migrations.py
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Build website
        run: npm run build
      - name: Install Chromium for browser tests
        run: npx playwright install --with-deps chromium
      - name: Test browser journeys and accessibility
        run: npm run test:e2e
      - name: Test enquiry API
        run: npm run test:api
      - name: Test portfolio contracts
        run: npm run test:portfolio
      - name: Validate public portfolio data
        run: npm run validate:portfolio
      - name: Audit dependencies
        run: npm audit --audit-level=high
