name: Validate River Ways project skills

on:
  pull_request:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate Agent Skills metadata
        run: python scripts/validate_skills.py .agents/skills
      - name: Validate project Codex agents
        run: python scripts/validate_codex_agents.py .codex/agents
      - name: Run validator regression tests
        run: python -m unittest discover -s tests -p "test_*.py"
